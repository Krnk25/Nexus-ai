<!DOCTYPE html>
<html lang="en">
    <head>
        <title></title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="css/style.css" rel="stylesheet">
        <style>
            .box{
                background-color: red;
                height: 100px;
                width: 100px;
                justify-content: center;
                align-items: center;
                display: flex;

                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50px,-50px);

                display: grid;
                place-items: center;
            }
        </style>
    </head>
    <body>
        <div class="box">box</div>
    
    </body>
</html>
